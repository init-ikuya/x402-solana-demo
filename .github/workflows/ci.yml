name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize nightly publishers, including manual runs from other branches.
  group: ci-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && 'nightly' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ANCHOR_VERSION: 1.2.0
  SOLANA_VERSION: 3.1.10
  PLATFORM_TOOLS_VERSION: v1.57

jobs:
  lint:
    name: Lint and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run payment:check

  test:
    name: Payment and LiteSVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run payment:test

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libssl-dev libudev-dev clang
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Install Anchor CLI and Solana CLI
        run: bash .github/scripts/install-anchor-solana.sh
      - name: Build SBF program for LiteSVM tests
        run: anchor build --arch v0 --tools-version "$PLATFORM_TOOLS_VERSION" --ignore-keys
      - name: Run in-process LiteSVM tests
        run: anchor test --skip-build --skip-deploy --skip-local-validator
      - name: Ensure dependency resolution did not change the lockfile
        run: git diff --exit-code -- Cargo.lock

  build:
    name: Build and publish nightly release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libssl-dev libudev-dev clang
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Install Anchor CLI and Solana CLI
        run: bash .github/scripts/install-anchor-solana.sh
      - name: Report tool versions
        run: |
          rustc --version
          anchor --version
          solana --version
      - name: Build SBF program and IDL
        run: anchor build --arch v0 --tools-version "$PLATFORM_TOOLS_VERSION" --ignore-keys
      - name: Ensure dependency resolution did not change the lockfile
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Render architecture and presentation PDFs
        run: |
          npx --yes @marp-team/marp-cli@4.5.0 --html --pdf \
            docs/architecture-submission.md -o docs/architecture-submission.pdf
          test -s docs/architecture-submission.pdf
          npx --yes @marp-team/marp-cli@4.5.0 --html --pdf \
            docs/topics/closing-settlement/slides.md -o docs/topics/closing-settlement/slides.pdf
          test -s docs/topics/closing-settlement/slides.pdf
          npx --yes @marp-team/marp-cli@4.5.0 --html --pdf \
            docs/topics/auth-capture/slides.md -o docs/topics/auth-capture/slides.pdf
          test -s docs/topics/auth-capture/slides.pdf
      - name: Package public build outputs
        run: python3 .github/scripts/package-nightly.py "$RUNNER_TEMP/nightly"
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-nightly.sh
